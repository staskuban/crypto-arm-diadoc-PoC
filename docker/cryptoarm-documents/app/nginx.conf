# КриптоАРМ Документы web UI (I7). Replaces the image's /etc/nginx/conf.d/default.conf.
# Based on upstream docker/nginx.conf of https://git.digtlab.ru/trusted/cryptoarm/documents/api
# (commit b167d46a): the SPA calls relative /api/... URLs with the session cookie of
# POST /api/login, so it must be served from the SAME origin as the API. nginx serves the static
# files and proxies the API paths to documents-api (no CORS, no API URL baked into the bundle).
# Differences from upstream: listens on 8080 (runs as uid 101, no privilege), body limit 51m
# (MAX_FILE_SIZE of the API + framing, instead of 12m), no proxy temp files (read-only root),
# default header buffers (upstream's 512k are for OIDC cookies; local login only here), security
# headers and SameSite=Strict on the API's cookies, and the upstream name is re-resolved (Docker
# DNS), so a recreated documents-api container with a new IP is found without restarting this one.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # The API refuses files of 50 MiB and more (MAX_FILE_SIZE=50, HTTP 413); 51m leaves room for
    # the multipart framing, so the API, not nginx, decides at the limit.
    client_max_body_size 51m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Docker's embedded DNS; with a variable in proxy_pass nginx resolves the name per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $documents_api http://documents-api:3000;

    root /usr/share/nginx/html;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell: always revalidated, so a new image's bundle names are picked up.
    location = /index.html {
        expires -1;
    }

    # Upstream redirects /diagnostic to https://sign.kloud.one/diagnostic/ (browser plug-in
    # check for the desktop signing methods); not used on this stand.

    location ~ ^/(api|\.well-known)(/|$)|^/(openapi\.json|llms\.txt)$ {
        # A variable without a URI part passes the request URI unchanged, as upstream's
        # proxy_pass http://backend; does. Never append a path here: with a variable, nginx would
        # then send that path instead of the request's.
        proxy_pass $documents_api;
        # HTTP/1.1 upstream: without it nginx buffers a chunked request body in full despite
        # proxy_request_buffering off (and would hit the small tmpfs, D230).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port (127.0.0.1:3041): proxy_redirect does not rewrite Location
        # headers when proxy_pass uses a variable, so the API must see the browser's host:port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets its session cookie without SameSite (cookie-session defaults); local login
        # needs no cross-site navigation, so Strict on this port (the API port 3040 is unchanged).
        proxy_cookie_flags ~ samesite=strict;
        # No temp files: the root filesystem is read-only and /var/cache/nginx is a small tmpfs, so
        # a buffered 40 MB upload failed there with 500 "No space left on device" (D230). Request
        # bodies are streamed to the API; large responses (downloads) wait for the client instead
        # of spilling to disk.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        # cloud-sign waits for КриптоАРМ Server (COMMAND_PROCESSING_TIMEOUT=120000 on the API).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
