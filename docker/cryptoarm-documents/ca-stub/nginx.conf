# Minimal stand-in for the "CA API" that КриптоАРМ Документы asks for a user's corporate certificate
# (CA_API_URI). The API calls, with the user's e-mail (see README.md, docs/research.md):
#   GET {CA_API_URI}/cert/{email}/exists       -> {"exists","has_pfx","has_private_key"} (profile flag)
#   GET {CA_API_URI}/cert/{email}?format=pfx   -> body sent as `cert` to КриптоАРМ Server /cms/sign
# Upstream expects a PFX here; this stub returns only the PUBLIC .cer (DER): КриптоАРМ Server then
# finds the private key already installed in its uMy store by thumbprint, so no key leaves the server.
#
# The e-mail -> certificate mapping below IS the key selection of cloud-sign. Files come from the
# КриптоАРМ Server certs directory mounted read-only at /certs. Unknown e-mail -> 404 -> Документы
# answer 400 "Не удалось получить корпоративный сертификат пользователя".
map $cert_email $cert_file {
    default                          "";
    "server-test@documents.local"    cryptoarm.server.test.cer;
    "o2-platforma@documents.local"   o2-platforma.test.cer;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout;
    default_type application/json;

    # $1 is the decoded path segment, so %40 arrives as "@".
    location ~ ^/cert/([^/]+)/exists$ {
        set $cert_email $1;
        if ($cert_file = "") {
            return 200 '{"exists":false,"has_pfx":false,"has_private_key":false}';
        }
        if (!-f /certs/$cert_file) {
            return 200 '{"exists":false,"has_pfx":false,"has_private_key":false}';
        }
        return 200 '{"exists":true,"has_pfx":true,"has_private_key":true}';
    }

    location ~ ^/cert/([^/]+)$ {
        set $cert_email $1;
        if ($cert_file = "") {
            return 404 '{"error":"no certificate for this e-mail"}';
        }
        default_type application/pkix-cert;
        root /certs;
        try_files /$cert_file =404;
    }

    location / {
        return 404 '{"error":"not found"}';
    }
}
